  name: About This Plugin
  category: sports
  description: 'Made by GrandPrixPicks.com. Install rather than Fork to get future updates. <br/><br/>Questions or ideas? <a href="https://discord.gg/c7YHSNE4Te">Join the Discord</a><br><br>Follow the current Formula 1 race weekend on your TRMNL. The screen leads with the next F1 session and its start time in your time zone, with the weather forecast for the circuit.<br><br>A timeline lists every session of the weekend. Upcoming sessions show temperature and rain. Once a session has run, its row lists the finishers in order, as many as fit: practice, qualifying, sprint and race.<br><br>More than six days before a race weekend, the screen lists the coming rounds and their dates instead, with the weekend&#39;s sessions below.<br><br>Beside the timeline is the weekend&#39;s news, with grid penalties and other changes that affect a session listed first. On race morning that space shows the confirmed starting grid, and after the race, the race result.<br><br>Between seasons, the screen shows the drivers&#39; and constructors&#39; championship standings.<br><br>Works in every TRMNL layout, landscape and portrait. Choose metric or imperial units, and a light or dark screen. No account needed.'
  learn_more_url: https://grandprixpicks.com/trmnl
  github_url: https://github.com/barrymichaeldoyle/GrandPrixPicks/tree/main/apps/trmnl
  email_address: barry@barrymichaeldoyle.com
