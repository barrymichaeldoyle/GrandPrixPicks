name: Formula 1 Race Weekend
description: 'F1 weekend: times, results, news'
recipe_overview: "Follow the current Formula 1 race weekend on your TRMNL. The screen leads with the next F1 session and its start time in your time zone, with the weather forecast for the circuit.\r\n\r\nA timeline lists every session of the weekend. Upcoming sessions show temperature and rain. Once a session has run, its row lists the finishers in order, as many as fit: practice, qualifying, sprint and race.\r\n\r\nMore than six days before a race weekend, the screen lists the coming rounds and their dates instead, with the weekend's sessions below.\r\n\r\nBeside the timeline is the weekend's news, with grid penalties and other changes that affect a session listed first. On race morning that space shows the confirmed starting grid, and after the race, the race result.\r\n\r\nBetween seasons, the screen shows the drivers' and constructors' championship standings.\r\n\r\nWorks in every TRMNL layout, landscape and portrait. Choose metric or imperial units, and a light or dark screen. No account needed."
refresh_interval: 15
