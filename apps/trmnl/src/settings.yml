---
name: Formula 1 Race Weekend
# The tagline in TRMNL's search results; TRMNL caps it at 35 characters.
description: 'F1 weekend: times, results, news'
strategy: polling
# Minutes. With on-demand refresh this is a floor, not a schedule: TRMNL
# polls just before the device draws, never more often than this. 15 is the
# fastest a free account allows; TRMNL+ devices can go to 5.
refresh_interval: 15
polling_url: https://grandprixpicks.com/api/trmnl/weekend?tz={{ trmnl.user.time_zone_iana }}&locale={{ trmnl.user.locale }}
polling_verb: GET
polling_headers: ''
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: about
    field_type: author_bio
    name: About This Plugin
    category: sports
    description: The current Formula 1 race weekend. Session times in your time zone, practice and session results as they are published, the confirmed starting grid on race morning, and the news behind them. From Grand Prix Picks.
    learn_more_url: https://grandprixpicks.com/trmnl
    email_address: barry@barrymichaeldoyle.com
