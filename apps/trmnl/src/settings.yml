name: Formula 1 Race Weekend
description: 'F1 weekend: times, results, news'
recipe_overview: |-
  Follow the current Formula 1 race weekend on your TRMNL. The screen leads with the next F1 session and its start time in your time zone, with the weather forecast for the circuit.

  A timeline lists every session of the weekend. Upcoming sessions show temperature, rain and wind. Once a session has run, its row shows the top three: practice, qualifying, sprint and race.

  Beside it is the weekend's news, with grid penalties and other changes that affect a session listed first. On race morning that space shows the confirmed starting grid, and after the race, the top ten.

  Between seasons, the screen shows the drivers' and constructors' championship standings.

  Works in every TRMNL layout, landscape and portrait. Choose metric or imperial units. No account needed.
refresh_interval: 15
