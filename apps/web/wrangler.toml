name = "grand-prix-picks"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Required so process.env is populated with Cloudflare Dashboard env vars
# (CLERK_JWT_KEY, CLERK_SECRET_KEY, etc.). Without this, Clerk middleware
# cannot see them and may throw HTTPError → 500.
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Environment variables are set in Cloudflare Dashboard
# Don't put secrets here - this file is committed to git

# Run the SSR worker near Convex instead of near the visitor. A cache miss
# makes several sequential Convex reads, and from a far edge (JNB) each one is
# a ~300ms trip to the US: race pages took 1.7s to first byte uncached. The
# edge cache still answers at the visitor's location; only misses move.
[placement]
mode = "smart"
