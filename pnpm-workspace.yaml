packages:
  - apps/*
  - packages/*

allowBuilds:
  '@clerk/shared': true
  '@sentry/cli': true
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  utf-8-validate: false
  workerd: true

auditConfig:
  ignoreGhsas:
    # image-size DoS in the ICNS (GHSA-w3rx-r6r6-pgpr / CVE-2025-71330) and
    # JXL/HEIF (GHSA-5p2g-fcmc-qvqq / CVE-2025-71329) parsers. Both are the
    # same bug class: a loop advances its cursor by a size field read straight
    # out of the file, so a zero-valued size pins the cursor and the loop never
    # exits, appending to an array forever until the heap dies.
    #
    # These stay ignored because **we patch them ourselves**, and pnpm audit
    # matches on version number, not file content: the patched package is still
    # called 1.2.1, so both advisories keep matching forever. See
    # patches/image-size@1.2.1.patch, wired up under patchedDependencies below.
    # Each patched loop computes its next cursor and breaks unless it actually
    # moved forward. Verified both ways: the crafted buffers OOM the unpatched
    # copy and return in <1ms against the patched one, and a well-formed
    # multi-entry ICNS still parses every entry rather than stopping at the
    # first. Only ICNS and JXL needed a guard: 1.2.1's findBox already carries
    # the zero-size check upstream, and its HEIF parser has no loop at all.
    #
    # There is no fixed release to move to instead, and there never will be:
    # 2.0.2 is the newest published version in either major (registry
    # dist-tags: latest 2.0.2, legacy 1.2.1), and the upstream repo
    # image-size/image-size was ARCHIVED on 2026-06-03, after the advisories
    # landed. Nobody is shipping a 2.0.3.
    #
    # One line survives in the tree, and it is not one we choose:
    #   image-size@1.2.1 <- metro <- react-native (all 101 paths)
    # Metro is stuck inside 1.x on its own terms: 1.x takes
    # `Uint8Array | string`, 2.x narrowed the input to `Uint8Array` only, and
    # metro's Assets.js hands it a file path for every asset that is not
    # inside a .zip. Forcing 2.x there breaks bundling on ordinary images.
    # Still true on metro@0.87.0, the newest release: it pins `image-size
    # ^1.0.2` and calls the default export, so there is no metro upgrade that
    # exits the 1.x line either.
    #
    # (A second line, image-size@2.0.2 <- @devvit/cli, was patched the same way
    # and then left the tree entirely on 2026-08-27 when the unfinished
    # apps/reddit Devvit prototype was deleted. Its patch is deleted too:
    # pnpm errors on a patch that matches nothing.)
    #
    # Scope, unchanged and still the reason this is not urgent: the one
    # consumer parses images at build time, from assets in this repo. Nothing
    # here reads an image an attacker chose, and metro does not ship to users,
    # it is the bundler.
    #
    # Revisit when metro moves off image-size 1.x: that deletes the patch
    # rather than updating it.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

    # decode-uri-component DoS (GHSA-vcc3-ghjq-m6fr): decoding malformed
    # percent-encoded input is superlinear. `decode()` retried the whole string
    # once per token, and each retry ran a recursive splitter over the token
    # array, so cost climbs far faster than input length. Measured on 0.2.2:
    # 400 tokens (1.2 KB) takes 3.1s of blocked CPU, and the curve puts a ~10 KB
    # string in the minutes. One malformed deep link is enough.
    #
    # Ignored for the same reason as image-size above: **we patch it
    # ourselves**, and pnpm audit matches on version number, not file content,
    # so 0.2.2 keeps matching the advisory forever. See
    # patches/decode-uri-component@0.2.2.patch. The patch is upstream's own fix
    # backported: `decode()` becomes a single left-to-right O(n) scan that
    # decodes valid UTF-8 runs and emits everything else literally. Verified
    # both ways: 32 inputs covering the BOM, lone continuation bytes, truncated
    # sequences, `+`, bare `%` and multi-byte characters return byte-identical
    # results to unpatched 0.2.2, and the 400-token input drops from 3118ms to
    # 0ms (20,000 tokens: 5ms).
    #
    # Upgrading is not an option, and this is not a case of nobody having got
    # to it yet. The advisory names >=0.4.3 as patched; **0.4.3 was never
    # published**. The registry has 0.1.0, 0.2.0, 0.2.1, 0.2.2, 0.3.0, 0.4.0,
    # 0.4.1, 0.5.0, so the only release outside the vulnerable range is 0.5.0,
    # which is `"type": "module"`. The single consumer is CJS:
    #   decode-uri-component@0.2.2 <- query-string@7.1.3 <- @react-navigation/
    #   core@7.21.13 <- @react-navigation/native (all 6 paths)
    # and query-string calls `require('decode-uri-component')(value)`. Against
    # an ESM module that require returns the namespace object, not the
    # function, so forcing 0.5.0 turns every deep link into a TypeError at
    # runtime rather than a build error. (An override to 0.5.0 was tried on
    # this branch in 4b21cc6 and reverted in e12bd9d.) 0.5.0 also drops the
    # `+`-to-space replacement query-string@7 relies on: `a+b` decodes to
    # `a b` on 0.2.2 and on this patch, `a+b` on 0.5.0.
    #
    # Revisit when @react-navigation/core drops query-string@7, or when
    # query-string ships a CJS build depending on a fixed release. Either
    # deletes the patch rather than updating it.
    - GHSA-vcc3-ghjq-m6fr

catalog:
  convex: 1.45.0
  typescript: 7.0.2

