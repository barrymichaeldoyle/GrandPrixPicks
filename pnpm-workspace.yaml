packages:
  - apps/*
  - packages/*

allowBuilds:
  '@clerk/shared': true
  '@sentry/cli': true
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  utf-8-validate: false
  workerd: true

auditConfig:
  ignoreGhsas:
    # brace-expansion DoS (unbounded expansion length -> OOM). The fix is an
    # EXPANSION_MAX_LENGTH accumulator cap that upstream shipped only in 5.0.8;
    # the advisory therefore marks every version <=5.0.7 vulnerable, including
    # the 1.x and 2.x lines that are still maintained.
    #
    # Two of those lines survive in the tree and cannot be overridden away:
    #   brace-expansion@1.1.18 <- minimatch@3.1.5 <- glob@7 <- dot-object
    #                             <- twirp-ts <- @devvit/protos
    #   brace-expansion@2.1.4  <- minimatch@5.1.9 <- filelist <- jake <- ejs
    #                             <- @oclif/core <- @devvit/cli
    # brace-expansion@5's CJS entry exports an object ({ expand, EXPANSION_MAX,
    # EXPANSION_MAX_LENGTH }) rather than a callable, but minimatch 3/5 do
    # `var expand = require('brace-expansion'); expand(pattern)`. Forcing 5.0.8
    # there fails with "expand is not a function" and breaks `devvit upload`
    # plus the protos codegen.
    #
    # Scope: all 105 paths are under apps/reddit (the Devvit prototype), and
    # they are reached only by build/CLI-time globbing over our own repo paths.
    # No attacker-controlled brace patterns, and nothing here ships to users or
    # reaches apps/web, apps/mobile, or apps/backend.
    #
    # Revisit when devvit drops the glob@7 / ejs chain, or when 1.x / 2.x pick
    # up a backport of the length cap.
    - GHSA-mh99-v99m-4gvg

    # image-size DoS in the ICNS (GHSA-w3rx-r6r6-pgpr) and JXL/HEIF
    # (GHSA-5p2g-fcmc-qvqq) parsers. Both advisories name >=2.0.3 as patched,
    # but 2.0.2 IS the latest published release: there is no fixed version to
    # override to, in either major.
    #
    # Two lines survive in the tree, neither of which we choose:
    #   image-size@1.2.1 <- metro <- react-native (all 101 paths)
    #   image-size@2.0.2 <- @devvit/cli
    # Metro is also stuck inside 1.x on its own terms: 1.x takes
    # `Uint8Array | string`, 2.x narrowed the input to `Uint8Array` only, and
    # metro's Assets.js hands it a file path for every asset that is not
    # inside a .zip. Forcing 2.x there breaks bundling on ordinary images.
    #
    # Scope: both consumers parse images at build time, from assets in this
    # repo. Nothing here reads an image an attacker chose, and neither package
    # ships to users: metro is the bundler, @devvit/cli is a CLI.
    #
    # Revisit when image-size publishes 2.0.3, or when metro moves off 1.x.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

    # extract-zip symlink path traversal. The advisory names >=2.0.2 as
    # patched, but 2.0.1 IS the latest published release: there is no fixed
    # version to override to, the same dead end as image-size above.
    #
    # One line in the tree, all of it new with Lighthouse CI:
    #   extract-zip@2.0.1 <- @puppeteer/browsers <- puppeteer-core
    #                     <- lighthouse <- @lhci/cli
    #
    # Scope: the only zip it opens is the Chrome build @puppeteer/browsers
    # downloads from Google so Lighthouse has a browser to drive. The archive
    # is not attacker-chosen, it is fetched over TLS from a fixed host, and
    # @lhci/cli is a devDependency that runs in CI and ships to nobody. On the
    # runners this actually executes on, Chrome is preinstalled and the
    # download path is never taken at all.
    #
    # Revisit when extract-zip publishes 2.0.2, or when puppeteer-core moves
    # off it.
    - GHSA-jmr9-qjv8-65gv

catalog:
  convex: 1.45.0
  typescript: 7.0.2

minimumReleaseAgeExclude:
  - dompurify@3.4.13
  - '@convex-dev/resend@0.2.5'
  - '@react-email/render@2.0.9'
  - '@tanstack/react-router@1.170.16'
  - '@tanstack/react-start-client@1.168.14'
  - '@tanstack/react-start-rsc@0.1.25'
  - '@tanstack/react-start-server@1.167.20'
  - '@tanstack/react-start@1.168.26'
  - '@tanstack/start-plugin-core@1.171.18'
  - '@tanstack/start-server-core@1.169.15'
  - miniflare@4.20260617.0
  - wrangler@4.102.0
  - '@clerk/backend@3.11.1'
  - '@clerk/localizations@4.13.0'
  - '@clerk/react@6.12.0'
  - '@clerk/shared@4.25.0'
  - '@clerk/tanstack-react-start@1.4.14'
  - '@clerk/ui@1.25.0'
  - '@typescript/typescript-aix-ppc64@7.0.2'
  - '@typescript/typescript-darwin-arm64@7.0.2'
  - '@typescript/typescript-darwin-x64@7.0.2'
  - '@typescript/typescript-freebsd-arm64@7.0.2'
  - '@typescript/typescript-freebsd-x64@7.0.2'
  - '@typescript/typescript-linux-arm64@7.0.2'
  - '@typescript/typescript-linux-arm@7.0.2'
  - '@typescript/typescript-linux-loong64@7.0.2'
  - '@typescript/typescript-linux-mips64el@7.0.2'
  - '@typescript/typescript-linux-ppc64@7.0.2'
  - '@typescript/typescript-linux-riscv64@7.0.2'
  - '@typescript/typescript-linux-s390x@7.0.2'
  - '@typescript/typescript-linux-x64@7.0.2'
  - '@typescript/typescript-netbsd-arm64@7.0.2'
  - '@typescript/typescript-netbsd-x64@7.0.2'
  - '@typescript/typescript-openbsd-arm64@7.0.2'
  - '@typescript/typescript-openbsd-x64@7.0.2'
  - '@typescript/typescript-sunos-x64@7.0.2'
  - '@typescript/typescript-win32-arm64@7.0.2'
  - '@typescript/typescript-win32-x64@7.0.2'
  - typescript@7.0.2
  - '@expo/cli@57.0.15'
  - '@expo/config-plugins@57.0.8'
  - '@expo/prebuild-config@57.0.12'
  - '@expo/router-server@57.0.6'
  - babel-preset-expo@57.0.7
  - expo-asset@57.0.11
  - expo-auth-session@57.0.7
  - expo-constants@57.0.11
  - expo-file-system@57.0.4
  - expo-linking@57.0.6
  - expo-modules-autolinking@57.0.10
  - expo-modules-core@57.0.11
  - expo-notifications@57.0.11
  - expo-server@57.0.3
  - expo-store-review@57.0.2
  - expo@57.0.13
  - knip@6.32.3

onlyBuiltDependencies:
  - '@clerk/shared'
  - '@sentry/cli'
  - browser-tabs-lock
  - bufferutil
  - core-js
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
  - utf-8-validate
  - workerd

overrides:
  '@expo/dom-webview': 55.0.6
  # react-native-css's compiled CSS visitor must match lightningcss's
  # serialization format (expo-tailwind setup requirement).
  lightningcss: 1.30.1
  # Force the latest workpool (transitive via @convex-dev/resend, which allows
  # ^0.4.6) so the email workpool's internal crons run on the newest release.
  '@convex-dev/workpool': 0.4.10
  '@clerk/clerk-js@>=5.22.0 <=5.125.9': 5.125.10
  '@clerk/clerk-react@>=5.9.0 <=5.61.5': 5.61.6
  '@clerk/shared@>=3.0.0 <=3.47.4': 3.47.5
  '@xmldom/xmldom@<0.8.13': 0.8.13
  # One line per surviving major, each lifted to the newest patch within its
  # own major. Staying inside the major is the point: minimatch 3/5 call the
  # CJS export directly, and 5.x exports an object instead of a function.
  #
  # This clears GHSA-rgw5-rvv9-x895, which upstream did backport to 1.x and
  # 2.x. It does not clear GHSA-mh99-v99m-4gvg, whose fix exists only in 5.x
  # and so still needs the ignore in auditConfig above.
  'brace-expansion@>=1.0.0 <1.1.18': 1.1.18
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'brace-expansion@>=3.0.0 <5.0.9': 5.0.9
  'dompurify@<3.4.13': 3.4.13
  'h3@<2.0.1-rc.21': 2.0.1-rc.21
  'lodash@<4.18.0': 4.18.1
  'minimatch@>=10.0.0 <10.2.3': 10.2.5
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'node-forge@<1.4.0': 1.4.0
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.4': 4.0.4
  'postcss@<8.5.23': 8.5.23
  'protobufjs@<7.6.5': 7.6.5
  'tmp@<0.2.6': 0.2.7
  'socket.io-parser@<4.2.7': 4.2.7
  'srvx@<0.11.13': 0.11.15
  'uuid@<14.0.0': 14.0.0
  'yaml@>=1.0.0 <1.10.3': 1.10.3
  'yaml@>=2.0.0 <2.8.3': 2.8.3
  'fast-uri@<3.1.5': 3.1.5
  '@protobufjs/utf8@<=1.1.0': '>=1.1.1'
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'js-cookie@<=3.0.5': '>=3.0.7'
  'shell-quote@<=1.8.4': 1.10.0
  'esbuild@>=0.17.0 <0.28.1': 0.28.1
  'ws@>=7.0.0 <7.5.11': 7.5.11
  'launch-editor@<=2.14.0': 2.14.1
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'engine.io@>=4.1.0 <6.6.7': 6.6.7
  'sharp@<0.35.0': 0.35.0
  'next@>=16.0.0 <16.2.11': 16.2.11
  '@opentelemetry/core@<2.8.0': 2.8.0
  '@babel/core@<=7.29.0': 7.29.6
  # Lifts @lhci/cli's pinned lighthouse 12.6.1 to the 13.x line, whose
  # puppeteer-core ^25.3.0 pulls @puppeteer/browsers 3.x. That line replaced
  # extract-zip with modern-tar, which is the only way to get
  # GHSA-jmr9-qjv8-65gv out of the tree: extract-zip 2.0.1 is the newest
  # release, so there is nothing to override it to directly.
  'lighthouse@<13.4.1': 13.4.1

  # Reached only through Convex/Nitro server plumbing; the 7.x line carries
  # the fix, so this is a patch lift rather than a major move.
  'undici@>=7.0.0 <7.29.0': 7.29.0
  # Transitive via @convex-dev/resend's workpool and apps/reddit's
  # @hono/node-server. Neither pins a range that excludes the fix.
  'hono@>=4.0.0 <4.12.34': 4.12.34
