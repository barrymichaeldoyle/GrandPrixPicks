  - '@convex-dev/resend@0.2.5'
  - '@react-email/render@2.0.9'
  - '@tanstack/react-router@1.170.16'
  - '@tanstack/react-start-client@1.168.14'
  - '@tanstack/react-start-rsc@0.1.25'
  - '@tanstack/react-start-server@1.167.20'
  - '@tanstack/react-start@1.168.26'
  - '@tanstack/start-plugin-core@1.171.18'
  - '@tanstack/start-server-core@1.169.15'
  - miniflare@4.20260617.0
  - wrangler@4.102.0
  - '@clerk/backend@3.11.1'
  - '@clerk/localizations@4.13.0'
  - '@clerk/react@6.12.0'
  - '@clerk/shared@4.25.0'
  - '@clerk/tanstack-react-start@1.4.14'
